<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Relations</title>
    <!-- Link to your manifest file -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#003366">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #003366;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .profile-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-icon {
            width: 40px;
            height: 40px;
            border-radius: 5px;
        }
        .profile-name {
            font-weight: bold;
            font-size: 16px;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box; /* Important for padding */
        }
        .saved-results {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            min-height: 100px;
        }
        .result-title {
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
        }
        .result-content {
            font-size: 16px;
            white-space: pre-wrap; /* Preserves line breaks */
        }
    </style>
</head>
<body>

<header>
    Customer Issue Log
</header>

<div class="content">
    <!-- Profile Card -->
    <div class="profile-card">
        <img src="image_1.png" alt="ABC Relations Icon" class="profile-icon">
        <span class="profile-name">Jane Doe</span>
    </div>

    <!-- Search Input (Data is saved here) -->
    <input type="text" id="searchInput" class="search-box" placeholder="Search by name... (data saves automatically)">

    <!-- Area to display the saved data -->
    <div class="saved-results">
        <div class="result-title">Log Entry for Jane Doe:</div>
        <div id="savedContent" class="result-content"></div>
    </div>
</div>

<script>
    // 1. Find the elements we need
    const searchInput = document.getElementById('searchInput');
    const savedContent = document.getElementById('savedContent');

    // 2. Define a unique key for this specific data
    const STORAGE_KEY = 'abc_relations_jane_doe_log';

    // 3. LOAD DATA: When the app opens, check if data exists and put it on the screen
    window.addEventListener('load', () => {
        const savedData = localStorage.getItem(STORAGE_KEY);
        if (savedData) {
            searchInput.value = savedData; // Put text in input box
            savedContent.textContent = savedData; // Display text below
        }
    });

    // 4. SAVE DATA: Every time the user types a letter, save the entire input instantly
    searchInput.addEventListener('input', () => {
        const dataToSave = searchInput.value;
        localStorage.setItem(STORAGE_KEY, dataToSave); // Save to phone's memory
        savedContent.textContent = dataToSave; // Update the display below immediately
    });

    // Register the Service Worker (Required for PWA installation)
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').then(registration => {
                console.log('ServiceWorker registration successful');
            }, err => {
                console.log('ServiceWorker registration failed: ', err);
            });
        });
    }
</script>

</body>
</html>
