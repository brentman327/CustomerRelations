<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Relations Manager</title>
  <style>
    :root { --primary: #0f172a; --accent: #2563eb; --bg: #f1f5f9; --card: #ffffff; --border: #cbd5e1; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: #1e293b; padding-bottom: 84px; }
    header { background: var(--primary); color: #fff; padding: 14px 16px; position: sticky; top: 0; z-index: 10; }
    header h1 { margin: 0 0 10px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .top-actions { display: flex; gap: 6px; }
    .top-actions button { background: #334155; color: #fff; padding: 6px 10px; font-size: 12px; border-radius: 6px; }
    .search-bar { width: 100%; padding: 10px 12px; border-radius: 8px; border: none; font-size: 15px; }
    .container { max-width: 720px; margin: 14px auto; padding: 0 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .cust-name { font-weight: 700; font-size: 17px; }
    .meta { font-size: 13px; color: #475569; margin: 8px 0; line-height: 1.5; }
    .notes-box { background: #fefce8; border-left: 3px solid #eab308; padding: 8px 10px; font-size: 14px; margin: 8px 0; white-space: pre-wrap; border-radius: 4px; }
    .card-actions { display: flex; gap: 8px; margin-top: 10px; }
    button { border: none; border-radius: 8px; padding: 9px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
    .btn-edit { background: #e2e8f0; color: #0f172a; flex: 1; }
    .btn-del { background: #fee2e2; color: #b91c1c; padding: 9px 12px; }
    .fab { position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: #fff; width: 56px; height: 56px; border-radius: 50%; font-size: 28px; box-shadow: 0 4px 12px rgba(37,99,235,0.4); display: flex; align-items: center; justify-content: center; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.6); z-index: 20; overflow-y: auto; padding: 16px; }
    .modal.open { display: block; }
    .modal-content { background: #fff; max-width: 540px; margin: 0 auto; border-radius: 12px; padding: 18px; }
    .modal-content h2 { margin-top: 0; font-size: 18px; }
    label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin: 10px 0 4px; text-transform: uppercase; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-footer { display: flex; gap: 10px; margin-top: 16px; }
    .btn-save { background: var(--accent); color: #fff; flex: 2; padding: 12px; }
    .btn-cancel { background: #e2e8f0; color: #0f172a; flex: 1; padding: 12px; }
    .status-msg { text-align: center; padding: 28px; color: #64748b; }
  </style>
</head>
<body>

<header>
  <h1>
    <span>Customer Relations (<span id="totalCount">0</span>)</span>
    <div class="top-actions">
      <button onclick="loadData()">Sync</button>
      <button onclick="setTokenPrompt()">Token</button>
    </div>
  </h1>
  <input type="search" id="searchInput" class="search-bar" placeholder="Search first/last name, model, serial, dates, notes..." oninput="render()" />
</header>

<div class="container" id="listContainer">
  <div class="status-msg">Loading...</div>
</div>

<button class="fab" onclick="openForm()">+</button>

<div class="modal" id="formModal">
  <div class="modal-content">
    <h2 id="modalTitle">New Customer</h2>
    <input type="hidden" id="f-ID" />

    <div class="row-2">
      <div>
        <label>First Name</label>
        <input type="text" id="f-FirstName" />
      </div>
      <div>
        <label>Last Name</label
